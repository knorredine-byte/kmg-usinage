<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1a" />
  <title>KMG USINAGE — 4.0</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #080c14;
      --bg-panel: #0e1622;
      --cyan: #00e5ff;
      --text-primary: #f0f6fc;
      --text-muted: #8b9bb5;
      --wa: #25d366;
      --border-glow: rgba(0, 229, 255, 0.25);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg-deep);
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.03) 0%, transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(0, 229, 255, 0.02) 0%, transparent 50%);
      color: var(--text-primary);
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      height: 100%;
      max-height: 98dvh;
      display: flex;
      align-items: center;
    }

    /* ===== CARTE PRINCIPALE ===== */
    .card {
      width: 100%;
      background: var(--bg-panel);
      border-radius: 32px;
      padding: 24px 20px 18px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.8),
        0 0 0 1px var(--border-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: box-shadow 0.4s ease;
    }

    /* Animation du contour */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.5px;
      background: conic-gradient(from 0deg at 50% 50%, transparent 0%, var(--cyan) 20%, transparent 40%, var(--cyan) 60%, transparent 80%, var(--cyan) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.5;
      animation: rotate-border 10s linear infinite;
    }
    @keyframes rotate-border {
      to { transform: rotate(360deg); }
    }

    /* ===== PARTICULES ===== */
    .bg-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: inherit;
      z-index: 0;
    }
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--cyan);
      opacity: 0;
      animation: float-particle 10s infinite alternate ease-in-out;
    }
    .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 85%; top: 40%; animation-delay: 2s; }
    .particle:nth-child(3) { left: 30%; top: 70%; animation-delay: 4s; }
    .particle:nth-child(4) { left: 70%; top: 10%; animation-delay: 1s; }
    .particle:nth-child(5) { left: 50%; top: 85%; animation-delay: 3s; }
    @keyframes float-particle {
      0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
      30% { opacity: 0.8; }
      70% { opacity: 0.6; }
      100% { opacity: 0; transform: translate(30px, -30px) scale(1.5); }
    }

    /* ===== EN‑TÊTE ===== */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      margin-bottom: 10px;
    }

    .brand-group {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .logo {
      font-size: clamp(32px, 7vw, 72px);
      font-weight: 700;
      letter-spacing: -2px;
      display: flex;
      align-items: baseline;
      gap: 2px;
    }
    .logo .metal {
      background: linear-gradient(135deg, #e0e8f0, #7a8a9a 40%, #c0cedb 65%, #5a6a7a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .logo .neon {
      color: var(--cyan);
      text-shadow: 0 0 20px var(--cyan), 0 0 60px rgba(0, 229, 255, 0.3);
      animation: pulse-neon 3s ease-in-out infinite alternate;
    }
    @keyframes pulse-neon {
      0% { text-shadow: 0 0 20px var(--cyan), 0 0 40px rgba(0, 229, 255, 0.2); }
      100% { text-shadow: 0 0 40px var(--cyan), 0 0 80px rgba(0, 229, 255, 0.5); }
    }

    .sous-titre {
      font-size: clamp(10px, 1.8vw, 18px);
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0.6;
      margin-top: -2px;
    }

    .services-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      font-size: clamp(9px, 1.2vw, 13px);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      background: rgba(0, 229, 255, 0.04);
      padding: 6px 14px;
      border-radius: 40px;
      border: 1px solid rgba(0, 229, 255, 0.08);
    }
    .services-tags span:not(:last-child)::after {
      content: '•';
      margin-left: 12px;
      color: var(--cyan);
      opacity: 0.3;
    }

    /* ===== GRILLE CONTACTS ===== */
    .grid-contacts {
      display: grid;
      gap: 10px;
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      z-index: 2;
      margin: 6px 0 8px;
    }

    .contact-card {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 20px;
      padding: 12px 4px;
      text-decoration: none;
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(2px);
    }
    .contact-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.05), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .contact-card:hover {
      transform: translateY(-2px);
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
    }
    .contact-card:hover::before { opacity: 1; }

    .contact-card .icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 229, 255, 0.06);
      border: 1px solid rgba(0, 229, 255, 0.12);
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .contact-card .icon svg {
      width: 20px;
      height: 20px;
      fill: var(--cyan);
    }

    .contact-card.whatsapp .icon {
      border-color: var(--wa);
      background: rgba(37, 211, 102, 0.06);
    }
    .contact-card.whatsapp .icon svg { fill: var(--wa); }

    .contact-card .label {
      font-weight: 600;
      font-size: clamp(10px, 1.2vw, 13px);
      letter-spacing: 0.3px;
    }
    .contact-card .value {
      font-size: clamp(8px, 1vw, 11px);
      color: var(--text-muted);
      margin-top: 1px;
      word-break: break-word;
      line-height: 1.2;
    }

    .contact-card .glow-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      margin-top: 4px;
      opacity: 0.5;
      transition: 0.3s;
      flex-shrink: 0;
    }
    .contact-card.whatsapp .glow-dot {
      background: var(--wa);
      box-shadow: 0 0 8px var(--wa);
    }
    .contact-card:hover .glow-dot { opacity: 1; transform: scale(1.3); }

    /* ===== SLOGAN ===== */
    .slogan-block {
      padding: 8px 10px;
      text-align: center;
      font-size: clamp(13px, 2.2vw, 22px);
      font-weight: 600;
      letter-spacing: 1px;
      border-top: 1px solid rgba(0, 229, 255, 0.06);
      color: var(--text-muted);
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }
    .slogan-block strong {
      color: var(--cyan);
      text-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
      font-weight: 700;
    }

    /* ===== RESPONSIVE ===== */
    /* Mobile : 2 colonnes, 3 lignes */
    @media (max-width: 700px) {
      body { padding: 6px; }
      .card { padding: 14px 12px 12px; border-radius: 24px; }
      .header { margin-bottom: 6px; gap: 6px; }
      .logo { font-size: clamp(28px, 7vw, 42px); }
      .services-tags { padding: 4px 10px; gap: 2px 8px; font-size: 8px; }
      .services-tags span:not(:last-child)::after { margin-left: 8px; }

      .grid-contacts {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        gap: 6px;
        margin: 4px 0 4px;
      }

      /* Le 5e élément (email) prend toute la largeur de la 3e ligne */
      .contact-card:nth-child(5) {
        grid-column: 1 / 3;
      }

      .contact-card { padding: 8px 2px; border-radius: 14px; }
      .contact-card .icon { width: 30px; height: 30px; margin-bottom: 2px; }
      .contact-card .icon svg { width: 16px; height: 16px; }
      .contact-card .label { font-size: 9px; }
      .contact-card .value { font-size: 7px; }
      .contact-card .glow-dot { width: 3px; height: 3px; margin-top: 2px; }

      .slogan-block {
        padding: 4px 6px;
        font-size: clamp(11px, 2.5vw, 14px);
        margin-top: 2px;
      }
    }

    /* Très petits écrans (< 380px) */
    @media (max-width: 380px) {
      .card { padding: 10px 8px 8px; }
      .logo { font-size: 24px; }
      .services-tags { font-size: 7px; padding: 2px 6px; }
      .contact-card .icon { width: 24px; height: 24px; }
      .contact-card .icon svg { width: 14px; height: 14px; }
      .contact-card .label { font-size: 8px; }
      .contact-card .value { font-size: 6px; }
      .slogan-block { font-size: 10px; }
    }

    /* Desktop / tablette : 5 colonnes sur 1 ligne */
    @media (min-width: 701px) {
      .grid-contacts {
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: 1fr;
        gap: 14px;
      }
      .contact-card:nth-child(5) {
        grid-column: auto;
      }
      .contact-card { padding: 16px 8px; }
      .contact-card .icon { width: 48px; height: 48px; }
      .contact-card .icon svg { width: 26px; height: 26px; }
      .card { padding: 30px 30px 20px; }
      .slogan-block { padding: 12px 0; }
    }
  </style>
</head>
