<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>KMG USINAGE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080c14;--panel:#0e1622;--cyan:#00e5ff;--text:#f0f6fc;--muted:#8b9bb5;--wa:#25d366}
html,body{height:100%;overflow:hidden;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;justify-content:center}
.container{width:100%;height:100dvh;display:flex;align-items:center;justify-content:center}
.card{width:100%;height:100dvh;background:var(--panel);padding:32px 28px 20px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}

/* ===== ANIMATION 1 : LIGNES DE SCAN ===== */
.card::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(0,229,255,.02) 40px,rgba(0,229,255,.02) 41px);animation:scan 8s linear infinite}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(41px)}}

/* ===== ANIMATION 2 : CONTOUR FLUIDE ===== */
.card::before{content:'';position:absolute;inset:-2px;padding:3px;border-radius:inherit;background:conic-gradient(from 0deg,transparent 0%,var(--cyan)20%,transparent 40%,var(--cyan)60%,transparent 80%,var(--cyan)100%);-webkit-mask:linear-gradient(#fff 0 0)content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none;opacity:.3;z-index:1;animation:borderFlow 8s linear infinite}
@keyframes borderFlow{to{transform:rotate(360deg)}}

/* ===== ANIMATION 3 : PARTICULES MINIMALISTES ===== */
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.p{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--cyan);opacity:0;animation:drift 12s infinite ease-in-out}
.p:nth-child(1){left:15%;top:30%;animation-delay:0s;animation-duration:14s}
.p:nth-child(2){left:80%;top:60%;animation-delay:2s;animation-duration:16s}
.p:nth-child(3){left:40%;top:80%;animation-delay:4s;animation-duration:12s}
.p:nth-child(4){left:70%;top:15%;animation-delay:6s;animation-duration:18s}
.p:nth-child(5){left:25%;top:55%;animation-delay:8s;animation-duration:15s}
@keyframes drift{0%{opacity:0;transform:translate(0,0)}20%{opacity:.6}80%{opacity:.4}100%{opacity:0;transform:translate(60px,-60px)}}

/* ===== ANIMATION 4 : ENTÊTE RÉVÉLATION ===== */
.header{text-align:center;z-index:2;flex-shrink:0;margin-bottom:12px;opacity:0;animation:reveal 1s ease-out forwards}
@keyframes reveal{0%{opacity:0;transform:scale(.96)}100%{opacity:1;transform:scale(1)}}

.logo{font-size:clamp(112px,30vw,260px);font-weight:700;letter-spacing:-6px;display:flex;justify-content:center;align-items:baseline;gap:4px}
.logo .metal{background:linear-gradient(135deg,#e0e8f0,#7a8a9a 40%,#c0cedb 65%,#5a6a7a);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .neon{color:var(--cyan);text-shadow:0 0 60px rgba(0,229,255,.2),0 0 120px rgba(0,229,255,.1);animation:glowPulse 4s ease-in-out infinite alternate}
@keyframes glowPulse{0%{text-shadow:0 0 40px rgba(0,229,255,.15),0 0 80px rgba(0,229,255,.08)}100%{text-shadow:0 0 80px rgba(0,229,255,.3),0 0 160px rgba(0,229,255,.15)}}

/* ===== ANIMATION 5 : SOUS‑TITRE STABLE ===== */
.sub{font-size:clamp(36px,6.4vw,68px);font-weight:600;letter-spacing:12px;color:var(--muted);opacity:.8;margin-top:-4px}
.services{font-size:clamp(26px,3.6vw,40px);font-weight:500;color:var(--muted);letter-spacing:6px;margin-top:8px;line-height:1.6}
.services span{margin:0 12px}

/* ===== ANIMATION 6 : CARTES EN CASCADE LENTE ===== */
.grid{display:grid;gap:16px;flex:1 1 auto;min-height:0;z-index:2;margin:8px 0}
.card-item{background:rgba(255,255,255,.02);border-radius:40px;padding:24px 8px;text-decoration:none;color:var(--text);border:1px solid rgba(255,255,255,.04);transition:all .4s cubic-bezier(.25,.46,.45,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;opacity:0;animation:cardAppear .8s ease-out forwards}
.card-item:nth-child(1){animation-delay:.15s}
.card-item:nth-child(2){animation-delay:.30s}
.card-item:nth-child(3){animation-delay:.45s}
.card-item:nth-child(4){animation-delay:.60s}
.card-item:nth-child(5){animation-delay:.75s}
@keyframes cardAppear{0%{opacity:0;transform:translateY(12px) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1)}}

/* ===== ANIMATION 7 : SURVOL RAFFINÉ ===== */
.card-item:hover{transform:translateY(-6px) scale(1.015);border-color:var(--cyan);box-shadow:0 8px 40px rgba(0,229,255,.08)}
.card-item .ico{width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,229,255,.04);border:1px solid rgba(0,229,255,.08);margin-bottom:10px;transition:all .4s ease}
.card-item:hover .ico{background:rgba(0,229,255,.08);border-color:var(--cyan);box-shadow:0 0 30px rgba(0,229,255,.05)}
.card-item .ico svg{width:60px;height:60px;fill:var(--cyan);transition:.3s}
.card-item.wa .ico{border-color:rgba(37,211,102,.15);background:rgba(37,211,102,.04)}
.card-item.wa .ico svg{fill:var(--wa)}
.card-item.wa:hover .ico{border-color:var(--wa);background:rgba(37,211,102,.08)}
.card-item .lbl{font-weight:700;font-size:clamp(15px,1.6vw,18px);letter-spacing:.5px;transition:.3s}
.card-item:hover .lbl{color:#fff}
.card-item .val{font-size:clamp(24px,2.4vw,30px);color:var(--muted);margin-top:6px;word-break:break-word;line-height:1.2;transition:.3s}
.card-item:hover .val{color:var(--text)}

/* ===== ANIMATION 8 : POINT RESPIRATOIRE ===== */
.card-item .dot{width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 20px rgba(0,229,255,.2);margin-top:10px;transition:all .4s;animation:dotPulse 3s ease-in-out infinite}
.card-item.wa .dot{background:var(--wa);box-shadow:0 0 20px rgba(37,211,102,.2)}
@keyframes dotPulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.1);opacity:.9}}
.card-item:hover .dot{animation-duration:1.2s;box-shadow:0 0 40px rgba(0,229,255,.4)}
.card-item.wa:hover .dot{box-shadow:0 0 40px rgba(37,211,102,.4)}

/* ===== ANIMATION 9 : SLOGAN APPARITION ===== */
.slogan{padding:16px 12px;text-align:center;font-size:clamp(44px,8.4vw,88px);font-weight:700;letter-spacing:4px;border-top:2px solid rgba(0,229,255,.06);color:var(--muted);z-index:2;flex-shrink:0;opacity:0;animation:sloganIn 1s ease-out .6s forwards}
@keyframes sloganIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
.slogan strong{color:var(--cyan);text-shadow:0 0 40px rgba(0,229,255,.15);font-weight:700;transition:.3s}
.slogan:hover strong{text-shadow:0 0 60px rgba(0,229,255,.25)}

/* ===== ANIMATION 10 : SCINTILLEMENT INFIME DU FOND ===== */
.card{background:var(--panel);background-image:radial-gradient(circle at 50% 50%,rgba(0,229,255,.01) 0%,transparent 60%),radial-gradient(circle at 80% 20%,rgba(0,229,255,.005) 0%,transparent 40%);animation:bgShift 12s ease-in-out infinite alternate}
@keyframes bgShift{0%{background-position:0% 0%}100%{background-position:100% 100%}}

/* ===== RESPONSIVE ===== */
@media(max-width:700px){
.card{padding:20px 12px 10px}
.logo{font-size:clamp(80px,22vw,140px)}
.sub{font-size:clamp(24px,5vw,38px);letter-spacing:6px}
.services{font-size:clamp(16px,2.6vw,24px);margin-top:4px}
.grid{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:10px;margin:4px 0}
.grid .card-item:nth-child(5){grid-column:1/3}
.card-item{padding:16px 6px;border-radius:24px}
.card-item .ico{width:72px;height:72px}
.card-item .ico svg{width:40px;height:40px}
.card-item .lbl{font-size:10px}
.card-item .val{font-size:16px}
.card-item .dot{width:8px;height:8px}
.slogan{font-size:clamp(28px,6vw,40px);padding:8px 6px}
}
@media(max-width:380px){
.logo{font-size:64px}
.sub{font-size:18px;letter-spacing:4px}
.services{font-size:12px}
.card-item .ico{width:56px;height:56px}
.card-item .ico svg{width:32px;height:32px}
.card-item .lbl{font-size:8px}
.card-item .val{font-size:13px}
.card-item .dot{width:6px;height:6px}
.slogan{font-size:22px}
}
@media(min-width:701px){
.card{border-radius:64px;height:auto;max-height:96dvh;padding:40px 50px 28px;box-shadow:0 40px 120px rgba(0,0,0,.8),0 0 0 2px rgba(0,229,255,.08)}
.card::before{border-radius:64px}
.grid{grid-template-columns:repeat(5,1fr);grid-template-rows:1fr;gap:24px}
.grid .card-item:nth-child(5){grid-column:auto}
.card-item{padding:28px 12px}
.card-item .ico{width:120px;height:120px}
.card-item .ico svg{width:70px;height:70px}
.card-item .lbl{font-size:17px}
.card-item .val{font-size:26px}
.slogan{font-size:clamp(48px,8vw,96px);padding:16px 0}
}
</style>
