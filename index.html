<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#05080d">

<title>KMG USINAGE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: #05080d;
    color: #f4f7f8;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* Légère texture de fond */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.15;
    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,0.025) 4px
        );
}

/* PAGE */
.page {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 20px 15px;
    position: relative;
    z-index: 1;
}

/* CADRE PRINCIPAL */
.frame {
    border: 1px solid #00bfff;
    border-radius: 18px;
    padding: 35px 25px;
    background:
        linear-gradient(
            145deg,
            #0a1016,
            #030609
        );

    box-shadow:
        0 0 20px rgba(0,191,255,0.12),
        inset 0 0 30px rgba(0,0,0,0.8);
}

/* EN-TÊTE */
.header {
    text-align: center;
}

/* LOGO */
.logo {
    font-size: clamp(70px, 17vw, 150px);
    font-weight: 900;
    letter-spacing: -8px;
    line-height: 0.85;
    color: #e5e9eb;

    text-shadow:
        2px 2px 0 #555,
        0 0 15px rgba(255,255,255,0.15);
}

.logo span {
    color: #00bfff;
}

/* NOM */
.brand {
    margin-top: 25px;
    font-size: clamp(28px, 6vw, 48px);
    font-weight: bold;
    letter-spacing: 7px;
    color: #f5f7f8;

    text-shadow:
        0 0 10px rgba(0,191,255,0.25);
}

/* SERVICES */
.services {
    margin-top: 20px;
    font-size: clamp(15px, 3.5vw, 25px);
    letter-spacing: 2px;
    color: #dfe5e8;
}

.services b {
    color: #00bfff;
    margin: 0 5px;
}

/* LIGNE */
.separator {
    width: 75%;
    height: 2px;
    margin: 30px auto 35px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00bfff,
            transparent
        );

    box-shadow:
        0 0 10px rgba(0,191,255,0.7);
}

/* GRILLE DES CONTACTS */
.cards {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 22px;

    width: 100%;
}

/* CARTE */
.card {
    min-height: 220px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 25px 15px;

    text-decoration: none;
    color: white;

    border: 1px solid #00bfff;
    border-radius: 8px;

    background:
        linear-gradient(
            145deg,
            #101820,
            #05090d
        );

    box-shadow:
        inset 0 0 20px rgba(0,0,0,0.7),
        0 0 8px rgba(0,191,255,0.08);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
}

/* EFFET AU TOUCHER */
.card:active {
    transform: scale(0.97);
}

.card:hover {
    transform: translateY(-4px);

    border-color: #5cddff;

    box-shadow:
        0 0 18px rgba(0,191,255,0.35),
        inset 0 0 20px rgba(0,0,0,0.7);
}

/* ICÔNE */
.icon {
    width: 90px;
    height: 90px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 18px;

    border: 1px solid #00bfff;
    border-radius: 12px;

    background: #05090d;

    color: #00bfff;

    font-size: 48px;
    font-weight: bold;

    box-shadow:
        0 0 12px rgba(0,191,255,0.25);
}

/* WHATSAPP */
.whatsapp .icon {
    color: #25d366;
    border-color: #25d366;

    text-shadow:
        0 0 10px rgba(37,211,102,0.7);

    box-shadow:
        0 0 15px rgba(37,211,102,0.18);
}

/* FACEBOOK */
.facebook .icon {
    color: #3b9cff;
}

/* MAPS */
.maps .icon {
    color: #00bfff;
}

/* EMAIL */
.email .icon {
    color: #00bfff;
}

/* NOM DE L'APPLICATION */
.card-title {
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 1px;

    color: #f4f7f8;
}

/* NUMÉRO / SOUS-TEXTE */
.card-text {
    margin-top: 10px;

    font-size: 18px;
    letter-spacing: 1px;

    color: #00bfff;
}

/* SLOGAN */
.slogan {
    margin-top: 35px;

    padding: 25px 15px;

    text-align: center;

    border: 1px solid #00bfff;
    border-radius: 8px;

    background:
        linear-gradient(
            145deg,
            #101820,
            #05090d
        );

    box-shadow:
        0 0 15px rgba(0,191,255,0.12);
}

.slogan {
    font-size: clamp(20px, 4vw, 34px);
    font-weight: bold;
    letter-spacing: 2px;
}

.slogan span {
    color: #00bfff;

    text-shadow:
        0 0 8px rgba(0,191,255,0.5);
}

/* TÉLÉPHONE */
@media (max-width: 700px) {

    .page {
        padding: 10px;
    }

    .frame {
        padding: 25px 12px;
    }

    .brand {
        letter-spacing: 4px;
    }

    .services {
        letter-spacing: 1px;
    }

    .separator {
        width: 90%;
    }

    .cards {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 14px;
    }

    .card {
        min-height: 190px;
        padding: 20px 8px;
    }

    .icon {
        width: 70px;
        height: 70px;

        font-size: 38px;
        margin-bottom: 14px;
    }

    .card-title {
        font-size: 18px;
    }

    .card-text {
        font-size: 15px;
    }
}

/* PETIT TÉLÉPHONE */
@media (max-width: 420px) {

    .frame {
        padding: 22px 10px;
    }

    .cards {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;
    }

    .card {
        min-height: 170px;
    }

    .icon {
        width: 60px;
        height: 60px;
        font-size: 32px;
    }

    .card-title {
        font-size: 16px;
    }

    .card-text {
        font-size: 13px;
    }

    .slogan {
        font-size: 18px;
    }
}

</style>
</head>
