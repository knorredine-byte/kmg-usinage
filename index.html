<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050709">

<title>KMG USINAGE — Contact</title>

<style>
:root{
  --black:#050709;
  --panel:#0b0f12;
  --panel2:#10161a;
  --cyan:#00b9f4;
  --cyan2:#008fbf;
  --white:#f1f4f5;
  --gray:#aab3b7;
  --metal:#cfd4d6;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--white);

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(0,185,244,.10),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #151b1f 0%,
      #050709 43%,
      #11171b 100%
    );

  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.16;

  background:
    repeating-linear-gradient(
      115deg,
      transparent 0 4px,
      rgba(255,255,255,.05) 5px,
      transparent 6px 10px
    );
}

.page{
  width:min(94%,560px);
  margin:0 auto;
  padding:16px 0 22px;
  position:relative;
}

.hero{
  position:relative;
  overflow:hidden;

  padding:30px 18px 28px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      #12191d 0%,
      #070a0c 55%,
      #151c20 100%
    );

  border:1px solid rgba(0,185,244,.75);

  box-shadow:
    0 18px 45px rgba(0,0,0,.55),
    inset 0 1px rgba(255,255,255,.10);

  clip-path:polygon(
    0 28px,
    28px 0,
    calc(100% - 28px) 0,
    100% 28px,
    100% calc(100% - 28px),
    calc(100% - 28px) 100%,
    28px 100%,
    0 calc(100% - 28px)
  );
}

.hero::after{
  content:"";
  position:absolute;
  left:10%;
  right:10%;
  bottom:11px;
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--cyan),
      transparent
    );

  box-shadow:0 0 12px var(--cyan);
}

.logo{
  display:inline-block;

  font-size:clamp(72px,21vw,115px);
  line-height:.82;

  font-weight:900;
  letter-spacing:-9px;

  color:var(--metal);

  text-shadow:
    2px 2px 0 #71787c,
    4px 5px 12px #000;
}

.logo span{
  color:var(--cyan);

  text-shadow:
    0 0 12px rgba(0,185,244,.60);
}

.brand{
  margin-top:14px;

  font-size:clamp(18px,5vw,28px);
  letter-spacing:11px;

  color:var(--cyan);

  font-weight:700;
}

.services{
  margin-top:28px;

  font-size:clamp(14px,4vw,20px);
  letter-spacing:2px;

  color:#e7ebed;

  text-transform:uppercase;
}

.services .dot{
  color:var(--cyan);
  padding:0 5px;
}

.decorative-line{
  width:72%;
  height:1px;

  margin:22px auto 24px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--cyan),
      transparent
    );

  box-shadow:0 0 10px rgba(0,185,244,.65);
}

.decorative-line::after{
  content:"";
  display:block;

  width:26px;
  height:8px;

  margin:-4px auto 0;

  border-left:1px solid var(--cyan);
  border-right:1px solid var(--cyan);

  transform:skewX(-35deg);

  background:#071014;
}

.buttons{
  display:grid;
  gap:10px;
  margin-top:16px;
}

.btn{
  position:relative;

  display:flex;
  align-items:center;

  min-height:65px;

  padding:8px 14px;

  color:var(--white);
  text-decoration:none;

  background:
    linear-gradient(
      105deg,
      #11181c 0%,
      #090d10 60%,
      #12181c 100%
    );

  border:1px solid rgba(205,214,218,.70);

  box-shadow:
    inset 0 1px rgba(255,255,255,.07),
    0 7px 18px rgba(0,0,0,.34);

  clip-path:polygon(
    0 0,
    96.5% 0,
    100% 50%,
    96.5% 100%,
    0 100%,
    4% 50%
  );

  transition:
    transform .15s ease,
    border-color .15s ease,
    box-shadow .15s ease;
}

.btn::before{
  content:"";

  position:absolute;
  left:0;
  top:0;
  bottom:0;

  width:5px;

  background:var(--cyan);

  box-shadow:
    0 0 12px rgba(0,185,244,.60);
}

.ico{
  width:46px;
  height:46px;

  margin-left:4px;
  margin-right:14px;

  flex:0 0 46px;

  display:grid;
  place-items:center;

  color:var(--cyan);

  font-size:24px;
  font-weight:900;

  background:
    linear-gradient(
      145deg,
      #0b1115,
      #05080a
    );

  border:1px solid rgba(0,185,244,.75);

  clip-path:polygon(
    14% 0,
    100% 0,
    86% 100%,
    0 100%
  );

  text-shadow:
    0 0 8px rgba(0,185,244,.60);
}

.btn:hover{
  transform:translateY(-2px);

  border-color:var(--cyan);

  box-shadow:
    0 10px 24px rgba(0,0,0,.45),
    0 0 14px rgba(0,185,244,.13);
}

.btn:active{
  transform:translateY(0);
}

.label{
  font-size:15px;
  font-weight:700;
  letter-spacing:.7px;
}

.number{
  color:var(--cyan);
  font-weight:800;
}

.btn::after{
  content:"›";

  margin-left:auto;

  color:var(--cyan);

  font-size:34px;
  line-height:1;
  font-weight:300;

  padding-right:8px;
}

.footer-slogan{
  width:100%;

  margin-top:18px;

  min-height:82px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:15px 18px;

  background:
    linear-gradient(
      110deg,
      #080b0d,
      #050709,
      #080b0d
    );

  border:1px solid var(--cyan);

  clip-path:polygon(
    0 18px,
    18px 0,
    calc(100% - 18px) 0,
    100% 18px,
    100% calc(100% - 18px),
    calc(100% - 18px) 100%,
    18px 100%,
    0 calc(100% - 18px)
  );

  box-shadow:
    0 0 15px rgba(0,185,244,.08),
    inset 0 0 18px rgba(0,0,0,.55);

  font-size:clamp(17px,4.8vw,26px);

  font-weight:700;
  letter-spacing:1.5px;

  text-transform:uppercase;
}

.footer-slogan span{
  color:var(--cyan);
}

@media(max-width:390px){

  .page{
    width:96%;
    padding-top:10px;
  }

  .hero{
    padding:25px 12px 24px;
  }

  .logo{
    font-size:72px;
  }

  .brand{
    font-size:18px;
    letter-spacing:8px;
  }

  .services{
    font-size:12px;
    letter-spacing:1px;
  }

  .btn{
    min-height:59px;
    padding:7px 10px;
  }

  .ico{
    width:41px;
    height:41px;
    flex-basis:41px;
    margin-right:10px;
  }

  .label{
    font-size:13px;
  }

  .btn::after{
    font-size:28px;
    padding-right:4px;
  }

  .footer-slogan{
    min-height:76px;
    font-size:18px;
  }
}
</style>
</head>
