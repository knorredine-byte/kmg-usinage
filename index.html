<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1a" />
  <title>KMG USINAGE — 4.0</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #080c14;
      --bg-panel: #0e1622;
      --cyan: #00e5ff;
      --cyan-dim: rgba(0, 229, 255, 0.15);
      --cyan-glow: 0 0 30px rgba(0, 229, 255, 0.3);
      --text-primary: #f0f6fc;
      --text-muted: #8b9bb5;
      --wa: #25d366;
      --border-glow: rgba(0, 229, 255, 0.25);
    }

    html {
      scroll-behavior: smooth;
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-deep);
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.03) 0%, transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(0, 229, 255, 0.02) 0%, transparent 50%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.01) 0px, rgba(255, 255, 255, 0.01) 2px, transparent 2px, transparent 8px);
      color: var(--text-primary);
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--bg-panel);
      border-radius: 40px 40px 20px 20px;
      padding: 50px 40px 40px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.8),
        0 0 0 1px var(--border-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(4px);
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.4s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: conic-gradient(from 0deg at 50% 50%, transparent 0%, var(--cyan) 20%, transparent 40%, var(--cyan) 60%, transparent 80%, var(--cyan) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.5;
      animation: rotate-border 12s linear infinite;
    }

    @keyframes rotate-border {
      to {
        transform: rotate(360deg);
      }
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
    }

    .brand-group {
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: clamp(48px, 10vw, 96px);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -2px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .logo .metal {
      background: linear-gradient(135deg, #e0e8f0, #7a8a9a 40%, #c0cedb 65%, #5a6a7a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .logo .neon {
      color: var(--cyan);
      text-shadow: 0 0 30px var(--cyan), 0 0 60px rgba(0, 229, 255, 0.4);
      animation: pulse-neon 3s ease-in-out infinite alternate;
    }

    @keyframes pulse-neon {
      0% {
        text-shadow: 0 0 20px var(--cyan), 0 0 40px rgba(0, 229, 255, 0.2);
      }
      100% {
        text-shadow: 0 0 40px var(--cyan), 0 0 80px rgba(0, 229, 255, 0.5), 0 0 120px rgba(0, 229, 255, 0.2);
      }
    }

    .sous-titre {
      font-size: clamp(14px, 2.5vw, 24px);
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 4px;
      opacity: 0.7;
    }

    .services-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      font-size: clamp(12px, 1.4vw, 16px);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      background: rgba(0, 229, 255, 0.04);
      padding: 12px 24px;
      border-radius: 60px;
      border: 1px solid rgba(0, 229, 255, 0.08);
      backdrop-filter: blur(2px);
    }

    .services-tags span {
      position: relative;
    }
    .services-tags span:not(:last-child)::after {
      content: '•';
      margin-left: 18px;
      color: var(--cyan);
      opacity: 0.4;
    }

    .grid-contacts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin: 40px 0 30px;
      position: relative;
      z-index: 2;
    }

    .contact-card {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 28px;
      padding: 20px 16px 16px;
      text-decoration: none;
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(2px);
    }

    .contact-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.04), transparent 60%);
      opacity: 0;
      transition: opacity 0.4s;
    }

    .contact-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--cyan);
      box-shadow: var(--cyan-glow), inset 0 0 20px rgba(0, 229, 255, 0.05);
    }

    .contact-card:hover::before {
      opacity: 1;
    }

    .contact-card .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 229, 255, 0.06);
      border: 1px solid rgba(0, 229, 255, 0.15);
      margin-bottom: 12px;
      transition: 0.3s;
    }

    .contact-card .icon svg {
      width: 28px;
      height: 28px;
      fill: var(--cyan);
      transition: 0.3s;
    }

    .contact-card.whatsapp .icon {
      border-color: var(--wa);
      background: rgba(37, 211, 102, 0.06);
    }
    .contact-card.whatsapp .icon svg {
      fill: var(--wa);
    }

    .contact-card .label {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: var(--text-primary);
    }

    .contact-card .value {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      word-break: break-word;
    }

    .contact-card .glow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
      margin-top: 10px;
      opacity: 0.6;
      transition: 0.4s;
    }

    .contact-card.whatsapp .glow-dot {
      background: var(--wa);
      box-shadow: 0 0 10px var(--wa);
    }

    .contact-card:hover .glow-dot {
      opacity: 1;
      transform: scale(1.3);
    }

    .slogan-block {
      margin-top: 30px;
      padding: 24px 20px;
      text-align: center;
      font-size: clamp(18px, 3.2vw, 32px);
      font-weight: 600;
      letter-spacing: 2px;
      border-top: 1px solid rgba(0, 229, 255, 0.08);
      border-bottom: 1px solid rgba(0, 229, 255, 0.08);
      color: var(--text-muted);
      position: relative;
      z-index: 2;
    }

    .slogan-block strong {
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.25);
      font-weight: 700;
    }

    .bg-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: inherit;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--cyan);
      opacity: 0;
      animation: float-particle 12s infinite alternate ease-in-out;
    }

    .particle:nth-child(1) {
      left: 10%;
      top: 20%;
      animation-delay: 0s;
      animation-duration: 14s;
    }
    .particle:nth-child(2) {
      left: 85%;
      top: 40%;
      animation-delay: 2s;
      animation-duration: 18s;
    }
    .particle:nth-child(3) {
      left: 30%;
      top: 70%;
      animation-delay: 4s;
      animation-duration: 16s;
    }
    .particle:nth-child(4) {
      left: 70%;
      top: 10%;
      animation-delay: 1s;
      animation-duration: 20s;
    }
    .particle:nth-child(5) {
      left: 50%;
      top: 85%;
      animation-delay: 3s;
      animation-duration: 15s;
    }

    @keyframes float-particle {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.5);
      }
      30% {
        opacity: 0.8;
      }
      70% {
        opacity: 0.6;
      }
      100% {
        opacity: 0;
        transform: translate(40px, -40px) scale(1.5);
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }
      .card {
        padding: 28px 18px 24px;
        border-radius: 28px;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
      }
      .services-tags {
        padding: 10px 16px;
        font-size: 11px;
        gap: 6px 12px;
        align-self: flex-start;
      }
      .services-tags span:not(:last-child)::after {
        margin-left: 12px;
      }
      .grid-contacts {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .contact-card {
        padding: 16px 10px;
      }
      .contact-card .icon {
        width: 48px;
        height: 48px;
      }
      .contact-card .icon svg {
        width: 24px;
        height: 24px;
      }
    }

    @media (max-width: 440px) {
      .grid-contacts {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
