<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05080a">
<title>KMG USINAGE</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 0%, rgba(0,190,235,.10), transparent 30%),
    linear-gradient(135deg, #161b1e, #050708 45%, #111619);
  color: #f2f4f5;
  font-family: Arial, Helvetica, sans-serif;
  padding: 18px 10px 30px;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .13;
  background: repeating-linear-gradient(
    115deg,
    transparent 0 4px,
    rgba(255,255,255,.08) 5px,
    transparent 6px 10px
  );
}

.page {
  width: min(100%, 560px);
  margin: auto;
  position: relative;
}

/* ===== EN-TÊTE ===== */

.hero {
  text-align: center;
  padding: 34px 15px 28px;
  border: 1px solid #00bce8;
  background: linear-gradient(145deg, #101619, #050809 70%, #151c20);
  box-shadow:
    0 18px 45px rgba(0,0,0,.55),
    inset 0 1px rgba(255,255,255,.12);
  clip-path: polygon(
    0 0,
    100% 0,
    100% 88%,
    96% 100%,
    4% 100%,
    0 88%
  );
}

.logo {
  font-size: clamp(70px, 19vw, 105px);
  line-height: .82;
  font-weight: 900;
  letter-spacing: -8px;
  color: #d7d9da;
  text-shadow:
    2px 2px 0 #70767a,
    5px 6px 14px #000;
}

.logo span {
  color: #00bce8;
}

.brand {
  margin-top: 14px;
  font-size: clamp(18px, 5vw, 27px);
  letter-spacing: 10px;
  color: #00bce8;
  font-weight: 700;
}

.services {
  margin-top: 30px;
  font-size: clamp(14px, 4vw, 19px);
  letter-spacing: 2px;
  text-transform: uppercase;
  white-space: nowrap;
}

.services span {
  color: #00aeda;
  padding: 0 5px;
}

/* ===== SLOGAN ===== */

.slogan {
  margin-top: 28px;
  padding: 0 5px 8px;
  font-size: clamp(21px, 6vw, 31px);
  line-height: 1.35;
  letter-spacing: 2px;
  font-weight: 700;
  text-transform: uppercase;
  border-bottom: 1px solid #00bce8;
  box-shadow: 0 8px 16px -12px #00bce8;
}

.slogan strong {
  color: #00bce8;
}

/* ===== CONTACT ===== */

.section-title {
  margin: 22px 5px 12px;
  color: #00bce8;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.buttons {
  display: grid;
  gap: 10px;
}

.btn {
  min-height: 62px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 16px;
  color: #f2f4f5;
  text-decoration: none;

  background:
    linear-gradient(100deg, #11191d, #070a0c);

  border: 1px solid rgba(215,220,222,.65);

  box-shadow:
    inset 0 1px rgba(255,255,255,.08),
    0 7px 18px rgba(0,0,0,.35);

  clip-path: polygon(
    0 0,
    97% 0,
    100% 50%,
    97% 100%,
    0 100%,
    4% 50%
  );

  transition: .15s ease;
}

.btn::before {
  content: "";
  width: 4px;
  height: 100%;
  background: #00bce8;
  box-shadow: 0 0 12px rgba(0,188,232,.65);
  flex: 0 0 4px;
}

.btn:hover {
  transform: translateY(-2px);
  border-color: #00bce8;
  box-shadow:
    0 10px 25px rgba(0,0,0,.45),
    0 0 15px rgba(0,188,232,.12);
}

.icon {
  width: 42px;
  height: 42px;
  flex: 0 0 42px;

  display: grid;
  place-items: center;

  color: #00bce8;
  border: 1px solid #00bce8;
  background: #081114;

  font-size: 20px;
  font-weight: 900;
}

.text {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .7px;
}

.number {
  color: #00bce8;
}

/* ===== BAS DE PAGE ===== */
/* Noir, sans adresse, téléphone, email ni séparation */

.footer-slogan {
  margin-top: 18px;
  width: 100%;
  min-height: 82px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  background: #050708;
  border: 0;

  color: #f2f4f5;

  font-size: clamp(17px, 5vw, 25px);
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.footer-slogan span {
  color: #00bce8;
}

/* ===== PETITS ÉCRANS ===== */

@media (max-width: 390px) {

  body {
    padding-left: 7px;
    padding-right: 7px;
  }

  .brand {
    letter-spacing: 7px;
  }

  .services {
    font-size: 12px;
    letter-spacing: 1px;
  }

  .btn {
    min-height: 58px;
    padding: 7px 12px;
  }

  .text {
    font-size: 13px;
  }
}
</style>
</head>
